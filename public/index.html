<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14231c">
  <title>MS Inspection Entry</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="scanner-page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="MS Inspection Entry">MS <span>Inspection Entry</span></a>
    <a class="admin-link" href="/admin">Admin</a>
  </header>

  <main class="scanner-shell">
    <section class="scanner-copy" aria-labelledby="page-title">
      <p class="section-label">Security checkpoint</p>
      <h1 id="page-title">Arahkan QR ke kamera</h1>
      <p>Kamera memindai otomatis. Hasil screening tampil segera setelah kode karyawan dikenali.</p>
      <div class="privacy-note">Kamera hanya digunakan selama halaman ini aktif.</div>
    </section>

    <section class="scanner-panel" aria-label="Pemindai QR">
      <div id="cameraStage" class="camera-stage">
        <video id="cameraVideo" playsinline muted aria-label="Tampilan kamera pemindai QR"></video>
        <div class="scan-frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div id="cameraPlaceholder" class="camera-placeholder">
          <strong>Kamera belum aktif</strong>
          <span>Tekan tombol di bawah untuk mulai</span>
        </div>
      </div>
      <p id="cameraStatus" class="camera-status" role="status">Siap memindai</p>
      <button id="cameraButton" class="btn btn-primary btn-lg w-100" type="button">Aktifkan kamera</button>

      <div class="manual-divider"><span>atau masukkan kode</span></div>
      <form id="manualForm" novalidate>
        <label class="form-label" for="employeeInput">Employee ID</label>
        <div class="input-group input-group-lg">
          <input id="employeeInput" class="form-control" maxlength="255" autocomplete="off" placeholder="Contoh: EMP001" required>
          <button id="manualButton" class="btn btn-dark" type="submit">Proses</button>
        </div>
      </form>
    </section>
  </main>

  <div id="resultOverlay" class="result-overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultMessage" hidden>
    <div class="result-content">
      <p id="resultLabel" class="result-label"></p>
      <h2 id="resultTitle"></h2>
      <p id="resultMessage"></p>
      <dl id="employeeDetails" class="employee-details"></dl>
    </div>
  </div>

  <script src="/scanner.js" defer></script>
</body>
</html>
